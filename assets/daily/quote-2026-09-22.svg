<rect x="296" y="428" width="38" height="38" rx="4" fill="none" stroke="#b0413e" stroke-width="3" opacity="0.8"/><text x="315" y="455" text-anchor="middle" font-family="'Yu Mincho', 'MS Mincho', serif" font-size="22" fill="#b0413e" opacity="0.85">言</text>
<text x="180" y="109" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#b0413e" opacity="0.6">“</text>
