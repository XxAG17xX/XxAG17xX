<text x="180" y="86" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#8fbf9f" opacity="0.6">“</text>
<text text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" fill="#e8f0ea"><tspan x="180" y="141">Because hardships</tspan><tspan x="180" y="169">strengthen resolve, the</tspan><tspan x="180" y="197">strong-minded will not</tspan><tspan x="180" y="226">be lured by worldly</tspan><tspan x="180" y="254">affairs. Today I step on</tspan><tspan x="180" y="283">grass; later I shall</tspan><tspan x="180" y="311">step on mountains and</tspan><tspan x="180" y="339">rivers!</tspan></text>
<rect x="160" y="369" width="40" height="1.5" fill="#8fbf9f" opacity="0.8"/>
<text x="180" y="399" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="3" fill="#d3e2d7">FANG YUAN</text>
<text x="180" y="421" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#8aa596">Reverend Insanity</text>
<text x="180" y="492" text-anchor="middle" font-family="'Yu Gothic', 'Meiryo', 'Hiragino Sans', sans-serif" font-size="12" letter-spacing="6" fill="#8aa596">今日の言葉</text>
