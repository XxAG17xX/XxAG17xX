# .github/workflows/space.yml
#
# Rewrites the section between the SPACE:START and SPACE:END markers in README.md once a
# day, and commits only when the content actually changed, so the profile does not collect
# an empty commit every morning.
#
# NASA_API_KEY is optional but worth setting. Without it the script uses DEMO_KEY, which is
# rate-limited per IP and shared across all GitHub-hosted runners, so APOD and EPIC will
# often 429 and it will fall back to the keyless NASA image archive. Free from
# api.nasa.gov; add it under Settings, Secrets and variables, Actions.
#
# Updated 2026-09-09 after a "Node.js 20 is deprecated" warning:
#   - actions/checkout bumped v4 -> v7 (v4 targets Node 20, which GitHub is retiring)
#   - actions/setup-python REMOVED rather than bumped. update_space.py imports nothing
#     outside the standard library and ubuntu-latest ships with Python, so the action was
#     pure overhead and one more thing to keep upgrading. Deleting a dependency beats
#     version-bumping one.

name: Space section

on:
  schedule:
    # 06:17 UTC daily. Deliberately off the hour: GitHub queues scheduled jobs at busy
    # times and on-the-hour crons get delayed.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: space-section
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify the splice and key guard before touching the README
        run: python3 scripts/update_space.py --self-check

      - name: Fetch and rewrite
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: python3 scripts/update_space.py --readme README.md

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- README.md; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update space section"
          git push
