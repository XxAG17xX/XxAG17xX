# .github/workflows/extras.yml
#
# The profile's other two daily pieces, kept out of space.yml so either can break alone:
#   picks  rewrites the PICKS:START...PICKS:END block (scripts/update_picks.py: AniList,
#          Open Library, ZenQuotes, all keyless), redraws today's quote card in
#          assets/daily/, and commits only when something changed.
#   snake  draws the contribution-graph snake in the README's neon colours and pushes the
#          SVGs to the `output` branch, so main does not collect a snake commit every day.
#
# 06:47 UTC, half an hour after space.yml, so the two never push to main at the same time.

name: Profile extras

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-extras-${{ github.ref }}
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Self-check
        run: python3 scripts/update_picks.py --self-check

      - name: Fetch and rewrite
        run: python3 scripts/update_picks.py --readme README.md

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain -- README.md assets/daily)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets/daily
          git commit -m "Update daily picks"
          git pull --rebase
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-neon.svg?palette=github-dark&color_snake=#ff2bd6&color_dots=#161b22,#0b3d4a,#0f6b7d,#1fb5c9,#7df9ff
            dist/snake-light.svg?color_snake=#d61fb4&color_dots=#ebedf0,#b8f3fb,#5fd8ea,#1aa5bd,#0b6f82

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
